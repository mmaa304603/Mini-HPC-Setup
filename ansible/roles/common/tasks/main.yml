---
# Common tasks for all nodes

# Create common directories
- name: Create common directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/hpc
    - /opt/software
    - /opt/modules
    - /scratch
  register: common_dirs

# Configure environment modules
- name: Configure environment modules
  template:
    src: modules.sh.j2
    dest: /etc/profile.d/modules.sh
    owner: root
    group: root
    mode: '0644'
  register: modules_config

# Configure limits
- name: Configure system limits
  template:
    src: limits.conf.j2
    dest: /etc/security/limits.conf
    owner: root
    group: root
    mode: '0644'
  register: limits_config

# Configure sysctl
- name: Configure sysctl parameters
  template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.conf
    owner: root
    group: root
    mode: '0644'
  register: sysctl_config
  notify: apply sysctl

# Create checkpoint for common setup
- name: Create common setup checkpoint
  include_role:
    name: checkpoint
  vars:
    checkpoint_name: "common_setup"
  register: common_checkpoint 