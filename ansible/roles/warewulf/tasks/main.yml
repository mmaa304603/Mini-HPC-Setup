---
- name: Install EPEL repository
  dnf:
    name: epel-release
    state: present

- name: Install Warewulf repository
  get_url:
    url: https://warewulf.org/downloads/warewulf-release-4.6.el8.noarch.rpm
    dest: /tmp/warewulf-release.rpm
  when: ansible_distribution_major_version == "8"

- name: Install Warewulf repository package
  dnf:
    name: /tmp/warewulf-release.rpm
    state: present
  when: ansible_distribution_major_version == "8"

- name: Install Warewulf packages
  dnf:
    name:
      - warewulf-server
      - warewulf-client
      - warewulf-common
    state: present

- name: Enable and start Warewulf services
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - warewulfd
    - dhcpd
    - tftp

- name: Configure Warewulf
  template:
    src: warewulf.conf.j2
    dest: /etc/warewulf/warewulf.conf
    mode: '0644'
  notify: restart warewulfd

- name: Create Rocky Linux container
  command: wwctl container build rocky-8
  args:
    creates: /var/lib/warewulf/container/rocky-8.img

- name: Import Rocky Linux container
  command: wwctl container import rocky-8
  args:
    creates: /var/lib/warewulf/container/rocky-8.img 