---
# Install dependencies
- name: Install Squid dependencies
  dnf:
    name:
      - wget
      - gcc
      - gcc-c++
      - make
      - pcre-devel
      - openssl-devel
      - libcap-devel
      - libtool
      - autoconf
      - automake
      - libxml2-devel
      - libcap
      - libcap-devel
      - libcap-ng-devel
      - libselinux-devel
      - pcre-devel
      - libtool-ltdl-devel
    state: present

# Install Squid package
- name: Install Squid package
  package:
    name: squid
    state: present

# Create Squid user and group if they don't exist
- name: Create Squid group
  group:
    name: "{{ squid_group }}"
    state: present

- name: Create Squid user
  user:
    name: "{{ squid_user }}"
    group: "{{ squid_group }}"
    shell: /sbin/nologin
    system: yes
    state: present

# Create necessary directories
- name: Create Squid directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ squid_user }}"
    group: "{{ squid_group }}"
    mode: '0755'
  loop:
    - "{{ squid_cache_dir }}"
    - "{{ squid_log_dir }}"
    - "{{ squid_ssl_cert_dir }}"

# Configure Squid
- name: Configure Squid
  template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: "{{ squid_user }}"
    group: "{{ squid_group }}"
    mode: '0644'
  notify: restart squid

# Initialize SSL certificate database
- name: Initialize SSL certificate database
  command: /usr/lib64/squid/security_cert_generator -c -s {{ squid_ssl_cert_dir }}
  args:
    creates: "{{ squid_ssl_cert_dir }}/db"
  notify: restart squid

# Enable and start Squid service
- name: Enable and start Squid service
  service:
    name: squid
    state: started
    enabled: yes

# Configure firewall if needed
- name: Allow Squid port in firewall
  firewalld:
    port: "{{ squid_port }}/tcp"
    permanent: yes
    state: enabled
  when: squid_configure_firewall | bool
  notify: reload firewalld

# Create environment module file
- name: Create modulefiles directory
  file:
    path: /etc/modulefiles/network
    state: directory
    mode: '0755'

- name: Create Squid module file
  template:
    src: squid.module.j2
    dest: /etc/modulefiles/network/squid
    mode: '0644'

# Clean up
- name: Clean up temporary files
  file:
    path: "/tmp/squid-{{ squid_version }}"
    state: absent 