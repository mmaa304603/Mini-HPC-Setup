---
#=========================================#
# Ansible Playbook - Mini HPC Cluster
#
# SETUP HEAD NODE AND COMPUTE NODES
#
#=========================================#
#
#----- ALL NODES (Initialize) ------
- name: Initialize all nodes
  hosts: all
  user: root
  gather_facts: True

  pre_tasks:
    - name: Set Global Variables for all host groups
      set_fact:
        #------ SLURM -----------------
        slurm_ver: "23.02.5"
        munge_ver: "0.5.15"
        #------ SPACK -----------------
        spack_ver: "0.20.1"
        #------ MONITORING ------------
        elasticsearch_ver: "8.11.1"
        logstash_ver: "8.11.1"
        kibana_ver: "8.11.1"
        grafana_ver: "10.0.3"
        #------ SQUID -----------------
        squid_ver: "5.7"
        #------ APPTAINER -------------
        apptainer_ver: "1.3.0"
        #------ OS NAME & VERSION -----
        os_name_ver_full: "{{ ansible_distribution | lower }}{{ ansible_distribution_version }}"
        os_name_ver: "{{ ansible_distribution | lower }}{{ ansible_distribution_major_version }}"
        #------ GENERAL ---------------
        log_dir: "/var/log/hpc-setup"
        checkpoint_dir: "/var/log/hpc-setup/checkpoints"

      tags: always

    - name: Block access to nodes during setup
      file:
        path: /etc/nologin
        state: touch
        owner: root
        mode: 0644
      register: nologin_created

    - name: Include checkpoint role for initialization
      include_role:
        name: checkpoint
      vars:
        checkpoint_name: "initial_setup"
      register: initial_checkpoint

  roles:
    - {role: init, tags: 'init,update'}
    - {role: common, tags: 'common'}
    - {role: spack, tags: 'spack'}

#------- HEAD NODE ----------------
- name: Configure Head Node
  hosts: headnode
  user: root
  gather_facts: False

  pre_tasks:
    - name: Check if network setup is complete
      include_role:
        name: checkpoint
      vars:
        checkpoint_name: "network_setup"
      register: network_checkpoint

  roles:
    - {role: network, tags: 'network', when: network_checkpoint is failed}
    - {role: squid, tags: 'squid', when: squid_enabled | default(true)}
    - {role: slurm_controller, tags: 'slurm'}
    - {role: spack_server, tags: 'spack'}
    - {role: elk, tags: 'elk', when: monitoring_enabled | default(true)}
    - {role: grafana, tags: 'grafana', when: monitoring_enabled | default(true)}

#------- COMPUTE NODES -----------
- name: Configure Compute Nodes
  hosts: computenodes
  user: root
  gather_facts: False

  pre_tasks:
    - name: Check if network setup is complete
      include_role:
        name: checkpoint
      vars:
        checkpoint_name: "network_setup"
      register: network_checkpoint

  roles:
    - {role: network, tags: 'network', when: network_checkpoint is failed}
    - {role: slurm_compute, tags: 'slurm'}
    - {role: spack_client, tags: 'spack'}
    - {role: monitoring_client, tags: 'monitoring', when: monitoring_enabled | default(true)}
    - {role: apptainer, tags: 'apptainer', when: apptainer_enabled | default(true)}

#----- ALL NODES (Finalize) ------
- name: Finalize all nodes
  hosts: all
  user: root
  gather_facts: False

  pre_tasks:
    - name: Check if all required setups are complete
      include_role:
        name: checkpoint
      vars:
        checkpoint_name: "final_setup"
      register: final_checkpoint

  roles:
    - {role: final, tags: 'final', when: final_checkpoint is failed}

  post_tasks:
    - name: List all checkpoints
      include_role:
        name: checkpoint
      vars:
        list_checkpoints: true
      when: list_checkpoints | default(false)
    
    - name: Clear specific checkpoint
      include_role:
        name: checkpoint
      vars:
        checkpoint_name: "{{ clear_checkpoint_name }}"
        clear_checkpoint: true
      when: clear_checkpoint_name is defined
    
    - name: Clear all checkpoints
      include_role:
        name: checkpoint
      vars:
        clear_all_checkpoints: true
      when: clear_all_checkpoints | default(false)

    - name: Remove nologin file to allow access
      file:
        path: /etc/nologin
        state: absent
      when: nologin_created is success 