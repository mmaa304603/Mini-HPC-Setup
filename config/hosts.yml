---
# The head is the local controller. CPU nodes need no SSH access until verifying stage.
all:
  children:
    headnode:
      hosts:
        head:
          ansible_connection: local
    computenodes:
      children:
        cpu_nodes:
          hosts:
            cpu01:
              ansible_host: 10.0.2.1
              cluster_mac: 00:e0:4c:06:07:3a      
            cpu02:
              ansible_host: 10.0.2.2
              cluster_mac: 00:e0:4c:06:07:6b
            cpu03:
              ansible_host: 10.0.2.3
              cluster_mac: 00:e0:4c:06:07:94
          vars:
            ansible_user: root
            cluster_architecture: x86_64
            slurm_sockets: 1
            slurm_cores_per_socket: 4
            slurm_threads_per_core: 1
            # Override per host if its usable memory differs.
            slurm_real_memory_mb: 7000
        gpu_nodes:
          hosts:
            gpu-01:
              ansible_host: 10.0.2.4
              cluster_architecture: aarch64
          # SSD-booted Jetson; initialize with core/playbooks/gpu.yml.
          # Configure its normal SSH login in group_vars/gpu_nodes.yml.
