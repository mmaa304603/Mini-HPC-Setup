# Spack Configuration
SPACK_ROOT="/opt/spack"
SPACK_ENV_FILE="/etc/profile.d/spack.sh"

# Package Configuration
PACKAGES=(
  "openmpi"
  "mpich"
  "hpl"
  "osu-micro-benchmarks"
  "stream"
  "cmake"
  "gcc"
)

# Environment Modules Configuration
MODULES_ENABLED=true
MODULES_TYPE="lmod"
MODULES_REFRESH=true 