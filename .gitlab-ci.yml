stages:
  - test
  - build
  - deploy
  - monitor

variables:
  SLURM_CLUSTER: hpc-cluster
  TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

test:
  stage: test
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker build -t hpc-test .
    - docker run hpc-test ./tests/unit/shell/run_tests.sh
    - docker run hpc-test ./tests/unit/ansible/run_tests.sh
    - docker run hpc-test ./tests/integration/network/run_tests.sh
    - docker run hpc-test ./tests/integration/services/run_tests.sh
    - docker run hpc-test ./tests/performance/benchmarks/run_benchmarks.sh
    - docker run hpc-test ./tests/regression/daily/run_tests.sh
    - docker run hpc-test ./tests/smoke/run_tests.sh
  artifacts:
    paths:
      - test-results/
    reports:
      junit: test-results/junit.xml
  only:
    - master
    - merge_requests

build:
  stage: build
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  only:
    - master

deploy:
  stage: deploy
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master

monitor:
  stage: monitor
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker run $CI_REGISTRY_IMAGE:latest ./tests/performance/monitoring/run_monitoring.sh
  only:
    - master
  when: on_success

benchmark:
  stage: benchmark
  script:
    - |
      #!/bin/bash
      
      # Load required modules
      module load openmpi
      module load hpl
      module load osu-micro-benchmarks
      module load stream
      
      # Run HPL benchmark
      srun --partition=normal --nodes=3 --ntasks-per-node=4 --time=01:00:00 hpl
      
      # Run OSU benchmarks
      srun --partition=normal --nodes=2 --ntasks-per-node=2 --time=00:30:00 osu_allreduce
      srun --partition=normal --nodes=2 --ntasks-per-node=2 --time=00:30:00 osu_bcast
      srun --partition=normal --nodes=2 --ntasks-per-node=2 --time=00:30:00 osu_alltoall
      
      # Run STREAM benchmark
      srun --partition=normal --nodes=3 --ntasks-per-node=1 --time=00:30:00 stream
      
      # Send results to Microsoft Teams
      curl -H "Content-Type: application/json" -d "{
        \"@type\": \"MessageCard\",
        \"@context\": \"http://schema.org/extensions\",
        \"themeColor\": \"0072C6\",
        \"summary\": \"HPC Benchmark Results\",
        \"sections\": [{
          \"activityTitle\": \"HPC Benchmark Results\",
          \"activitySubtitle\": \"Benchmark run completed on $(date)\",
          \"facts\": [{
            \"name\": \"Status\",
            \"value\": \"Completed\"
          }]
        }]
      }" $TEAMS_WEBHOOK_URL
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  tags:
    - hpc 