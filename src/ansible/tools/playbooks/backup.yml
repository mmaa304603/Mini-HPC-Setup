---
- name: Configure Backup System
  hosts: headnode
  become: true
  
  pre_tasks:
    - name: Load backup configuration
      include_vars:
        file: ../vars/backup.yml
        
    - name: Ensure backup directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
        owner: root
        group: "{{ admin_group }}"
      loop:
        - "{{ backup_root }}"
        - "{{ backup_root }}/daily"
        - "{{ backup_root }}/weekly"
        - "{{ backup_root }}/monthly"

  roles:
    - role: tools/roles/backup
      tags: ['backup', 'setup']
      
    - role: tools/roles/monitoring
      tags: ['monitoring', 'backup']
      vars:
        monitor_backup: true

  post_tasks:
    - name: Schedule backup jobs
      cron:
        name: "{{ item.name }}"
        job: "{{ item.job }}"
        hour: "{{ item.hour }}"
        minute: "{{ item.minute }}"
        weekday: "{{ item.weekday | default('*') }}"
        month: "{{ item.month | default('*') }}"
      loop:
        - name: "Daily Backup"
          job: "/usr/local/sbin/hpc-backup.sh daily"
          hour: "1"
          minute: "0"
        - name: "Weekly Backup"
          job: "/usr/local/sbin/hpc-backup.sh weekly"
          hour: "2"
          minute: "0"
          weekday: "0"
        - name: "Monthly Backup"
          job: "/usr/local/sbin/hpc-backup.sh monthly"
          hour: "3"
          minute: "0"
          weekday: "1"
          month: "*/1" 