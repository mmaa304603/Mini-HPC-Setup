---
setup_system_defaults:
  required_distribution: Rocky
  required_rocky_major_version: "9"

  # Minimums currently used by src/shell/config/config.conf.
  min_disk_space_gb: 4
  min_memory_gb: 1
  min_cpu_cores: 1

  network_interface: enp0s8
  bootstrap_commands:
    - dnf
    - systemctl
    - ip
    - df
    - free
    - nproc

  admin_group: hpc-admin
  user_group: hpc-users
  admin_user: "{{ lookup('ansible.builtin.env', 'SUDO_USER') or lookup('ansible.builtin.env', 'USER') }}"
  service_users:
    - name: slurm
      group: slurm
      uid: 960
      gid: 968
    - name: munge
      group: munge
      uid: 959
      gid: 967

  network_connection_name: cluster-internal
  network_address: 10.0.0.1
  network_prefix: 22
  network_gateway: ""
  network_dns: []
