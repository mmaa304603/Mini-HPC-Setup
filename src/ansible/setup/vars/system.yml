---
# System Configuration Variables

# System Paths
setup_complete_flag: /var/log/hpc-setup/setup_complete
log_dir: /var/log/hpc-setup
config_dir: /etc/hpc-setup

# Package Management
package_manager: dnf  # or yum for older systems
enable_epel: true
enable_powertools: true

# User Management
admin_group: hpc-admin
user_group: hpc-users
slurm_user: slurm
munge_user: munge

# Network Configuration
cluster_network: 10.0.0.0/24
management_network: 192.168.1.0/24
storage_network: 172.16.0.0/24

# Security Settings
firewall_service: firewalld
selinux_state: enforcing
min_password_length: 12
password_max_days: 90
failed_login_attempts: 5
ssh_port: 22
allowed_ssh_groups: ['hpc-admin']

# System Requirements
min_cpu_cores: 2
min_memory_gb: 4
min_root_disk_gb: 20
required_packages:
  - epel-release
  - wget
  - git
  - vim
  - tmux
  - htop
  - nfs-utils
  - chrony 