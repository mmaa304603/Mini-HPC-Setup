---
- name: Validate network configuration inputs
  ansible.builtin.assert:
    that:
      - setup_network_interface | length > 0
      - setup_network_connection_name | length > 0
      - setup_network_address is match('^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$')
      - setup_network_address.split('.') | map('int') | min >= 0
      - setup_network_address.split('.') | map('int') | max <= 255
      - setup_network_prefix | int >= 1
      - setup_network_prefix | int <= 32
    fail_msg: Network configuration values are incomplete or invalid.

- name: Configure the cluster network connection
  community.general.nmcli:
    conn_name: "{{ setup_network_connection_name }}"
    ifname: "{{ setup_network_interface }}"
    type: ethernet
    method4: manual
    ip4:
      - "{{ setup_network_address }}/{{ setup_network_prefix }}"
    gw4: "{{ setup_network_gateway }}"
    dns4: "{{ setup_network_dns }}"
    autoconnect: true
    state: present

- name: Read active NetworkManager connections
  ansible.builtin.command:
    argv: [nmcli, --terse, --fields, NAME, connection, show, --active]
  register: setup_active_network_connections
  changed_when: false
  check_mode: false

- name: Activate the cluster network connection
  ansible.builtin.command:
    argv: [nmcli, connection, up, "{{ setup_network_connection_name }}"]
  when: >-
    setup_network_connection_name not in
    setup_active_network_connections.stdout_lines
