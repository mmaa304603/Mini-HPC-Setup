---
- name: Read booted image identity
  ansible.builtin.command:
    argv: [cat, /etc/hpc-image-id]
  delegate_to: "{{ warewulf_verify_node.name }}"
  register: warewulf_booted_identity
  changed_when: false
  failed_when: warewulf_booted_identity.rc != 0 or warewulf_booted_identity.stdout != warewulf_image_identity
- name: Read booted node addresses
  ansible.builtin.command:
    argv: [ip, -j, -4, address, show]
  delegate_to: "{{ warewulf_verify_node.name }}"
  register: warewulf_booted_addresses
  changed_when: false
- name: Require the assigned CPU address
  ansible.builtin.assert:
    that: >-
      warewulf_verify_node.address in
      (warewulf_booted_addresses.stdout | from_json | map(attribute='addr_info') |
       flatten | map(attribute='local') | list)
- name: Trigger the shared software automount
  ansible.builtin.command:
    argv: [stat, "{{ warewulf_spack_export }}/bin/spack"]
  delegate_to: "{{ warewulf_verify_node.name }}"
  changed_when: false
  when: "'spack' in core_components"
- name: Inspect the software filesystem
  ansible.builtin.command:
    argv: [findmnt, --json, --list, --mountpoint, "{{ warewulf_spack_export }}", --output, 'TARGET,SOURCE,FSTYPE,OPTIONS']
  delegate_to: "{{ warewulf_verify_node.name }}"
  register: warewulf_software_mount
  changed_when: false
  when: "'spack' in core_components"
- name: Require the head's read-only NFS software export
  vars:
    # systemd automounts can return an autofs row before the mounted NFS row.
    warewulf_software_nfs_mounts: >-
      {{ (warewulf_software_mount.stdout | from_json).filesystems | default([])
         | selectattr('target', 'equalto', warewulf_spack_export)
         | selectattr('fstype', 'in', ['nfs', 'nfs4']) | list }}
  ansible.builtin.assert:
    that:
      - warewulf_software_nfs_mounts | length == 1
      - warewulf_software_nfs_mounts[0].source == core_cluster.head.address ~ ':' ~ warewulf_spack_export
      - "'ro' in warewulf_software_nfs_mounts[0].options.split(',')"
      - "'rw' not in warewulf_software_nfs_mounts[0].options.split(',')"
    fail_msg: >-
      {{ warewulf_verify_node.name }} must mount
      {{ core_cluster.head.address }}:{{ warewulf_spack_export }} read-only at
      {{ warewulf_spack_export }}. Observed mounts: {{ warewulf_software_mount.stdout }}
  when: "'spack' in core_components"
