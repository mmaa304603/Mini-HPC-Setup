---
- name: Write the private cluster firewall zone
  ansible.builtin.template:
    src: cluster-zone.xml.j2
    dest: "/etc/firewalld/zones/{{ warewulf_cluster_zone }}.xml"
    mode: '0644'

- name: Create policy directory
  ansible.builtin.file:
    path: /etc/firewalld/policies
    state: directory
    mode: '0755'

- name: Allow NAT only for traffic originating in the cluster zone
  ansible.builtin.copy:
    dest: /etc/firewalld/policies/hpc-egress.xml
    mode: '0644'
    content: |
      <?xml version="1.0" encoding="utf-8"?>
      <policy target="ACCEPT">
        <ingress-zone name="{{ warewulf_cluster_zone }}"/>
        <egress-zone name="ANY"/>
        <masquerade/>
      </policy>

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_file: /etc/sysctl.d/90-hpc-forwarding.conf
    sysctl_set: true
    reload: true

- name: Find the already active cluster connection
  ansible.builtin.command:
    argv: [nmcli, -g, GENERAL.CONNECTION, device, show, "{{ core_cluster.network.interface }}"]
  register: warewulf_connection
  changed_when: false

- name: Require the existing setup connection
  ansible.builtin.assert:
    that:
      - warewulf_connection.stdout | length > 0
      - warewulf_connection.stdout != '--'

- name: Read its firewall zone
  ansible.builtin.command:
    argv: [nmcli, -g, connection.zone, connection, show, "{{ warewulf_connection.stdout }}"]
  register: warewulf_connection_zone
  changed_when: false

- name: Persist only the cluster connection's firewall-zone assignment
  ansible.builtin.command:
    argv: [nmcli, connection, modify, "{{ warewulf_connection.stdout }}", connection.zone, "{{ warewulf_cluster_zone }}"]
  when: warewulf_connection_zone.stdout != warewulf_cluster_zone
  changed_when: true

- name: Load the private firewall configuration
  ansible.builtin.command:
    argv: [firewall-cmd, --reload]
  changed_when: true

- name: Apply the cluster interface zone without reactivating its connection
  ansible.posix.firewalld:
    zone: "{{ warewulf_cluster_zone }}"
    interface: "{{ core_cluster.network.interface }}"
    permanent: true
    immediate: true
    state: enabled
