---
- name: Create the shared service groups
  ansible.builtin.group:
    name: "{{ item.group }}"
    gid: "{{ item.gid }}"
    system: true
    state: present
  loop: "{{ gpu_cluster.service_users }}"

- name: Create missing service users with the head's numeric identities
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.group }}"
    home: "/var/lib/{{ item.name }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present
  loop: "{{ gpu_cluster.service_users }}"
  when: item.name not in ansible_facts.getent_passwd

- name: Install the small Ubuntu worker baseline
  ansible.builtin.apt:
    name: [ca-certificates, chrony, nfs-common]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set the inventory hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Keep the local hostname resolvable
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Configure the head as the Jetson time source
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Jetson restart chrony

- name: Enable the Jetson time service
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
