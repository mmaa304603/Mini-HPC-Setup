- name: Require a concrete executable smoke test
  ansible.builtin.assert:
    that:
    - not ansible_check_mode
    - spack_verify_command is sequence and spack_verify_command is not string
    - spack_verify_command | length > 0
    - spack_verify_command[0] is match('^[A-Za-z0-9_.+-]+$')
- name: Require every requested package to be installed
  ansible.builtin.command:
    argv:
    - '{{ spack_install_dir }}/bin/spack'
    - -e
    - '{{ spack_environment_dir }}'
    - find
    - --format
    - '{hash}'
    - '{{ item }}'
  environment: '{{ spack_command_environment }}'
  loop: '{{ spack_packages }}'
  register: spack_verify_specs
  changed_when: false
  failed_when: spack_verify_specs.rc != 0 or spack_verify_specs.stdout | trim | length
    == 0
  become: true
  become_user: '{{ spack_build_user }}'
- name: Run the selected executable on the head
  ansible.builtin.command:
    argv: '{{ [spack_view_dir ~ ''/bin/'' ~ spack_verify_command[0]] + spack_verify_command[1:]
      }}'
  changed_when: false
  become: true
  become_user: nobody
- name: Check the same executable on each CPU node
  ansible.builtin.command:
    argv: '{{ [spack_view_dir ~ ''/bin/'' ~ spack_verify_command[0]] + spack_verify_command[1:]
      }}'
  delegate_to: '{{ item.name }}'
  loop: '{{ core_cluster.cpu_nodes }}'
  changed_when: false
  become: true
  become_user: nobody
