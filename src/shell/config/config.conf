# HPC Configuration File

# System Configuration
SYSTEM_NAME="HPC Cluster"
ADMIN_EMAIL="admin@ttu.edu"
SUPPORT_EMAIL="support@ttu.edu"

# Directory Configuration
HOME_DIR="/home"
SHARED_DIR="/shared"
SCRATCH_DIR="/scratch"
BACKUP_DIR="/backup"
LOG_DIR="/var/log/hpc"

# Service Configuration
SLURM_CONFIG="/etc/slurm/slurm.conf"
WAREWULF_CONFIG="/etc/warewulf/warewulf.conf"
GLOBUS_CONFIG="/etc/globus-connect-server/config.json"

# Network Configuration
NETWORK_INTERFACE="enp2s0"
NETWORK_IP="10.0.0.1"
NETWORK_MASK="255.255.255.0"
DNS_SERVERS="8.8.8.8 8.8.4.4"

# Backup Configuration
BACKUP_RETENTION_DAYS=30
BACKUP_COMPRESSION="gzip"
BACKUP_ENCRYPTION="aes-256-cbc"

# Monitoring Configuration
MONITORING_INTERVAL=300
ALERT_THRESHOLD_CPU=90
ALERT_THRESHOLD_MEMORY=90
ALERT_THRESHOLD_DISK=90

# Security Configuration
FIREWALL_ENABLED=true
SELINUX_ENABLED=true
AUDIT_ENABLED=true

# Logging Configuration
LOG_LEVEL="INFO"
LOG_RETENTION_DAYS=30
LOG_COMPRESSION=true

# User Configuration
USER_QUOTA_HOME="50G"
USER_QUOTA_SCRATCH="100G"
MAX_USER_JOBS=100

# Job Configuration
MAX_JOB_TIME="7-00:00:00"
MAX_NODES_PER_JOB=32
MAX_CPUS_PER_JOB=128
MAX_MEMORY_PER_JOB="256G" 