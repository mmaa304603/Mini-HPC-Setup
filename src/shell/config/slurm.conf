# SLURM Configuration
CLUSTER_NAME="hpc-cluster"
NODE_COUNT=3
NODE_PREFIX="compute"
PARTITION_NAME="normal"
DEFAULT_PARTITION=true
MAX_TIME="INFINITE"
LOG_DIR="/var/log/slurm"
STATE_SAVE_LOCATION="/var/spool/slurm/state"

# Accounting Configuration
ACCOUNTING_ENABLED=true
ACCOUNTING_STORAGE_TYPE="accounting_storage/slurmdbd"
ACCOUNTING_STORAGE_HOST="localhost"
ACCOUNTING_STORAGE_USER="slurm"

# Job Configuration
MAX_JOB_COUNT=10000
MAX_JOBS_PER_USER=1000

# Scheduling Configuration
SELECT_TYPE="select/linear"
FAST_SCHEDULE=true 