#!/bin/bash

# Slurm component configuration (variables used by scripts)

# Cluster
SLURM_CLUSTER_NAME="mini-hpc"

# Network ports
SLURMCTLD_PORT=6817
SLURMD_PORT=6818
SLURM_SRUN_PORT_RANGE="60001-63000"

# Service account IDs must match on the controller and every compute node.
SLURM_UID=960
SLURM_GID=968

# Partitions and nodes
SLURM_CPU_NODES=("cpu01" "cpu02" "cpu03")
SLURM_GPU_NODES=("gpu01")

# CPU topology defaults (adjust to your hardware)
SLURM_SOCKETS=1
SLURM_CORES_PER_SOCKET=4
SLURM_THREADS_PER_CORE=1

# Memory defaults
SLURM_DEFAULT_MEM=7000
SLURM_MAX_MEM=64000

# GPU settings
SLURM_GPU_ENABLED=false
SLURM_GPU_NODELIST="gpu01"
SLURM_GPU_GRES="gpu:1"
SLURM_GPU_CPUS=6
SLURM_GPU_MEM=16000
