#!/bin/bash

# Apptainer configuration file

# Version
APPTAINER_VERSION="1.2.5"

# Installation directories
APPTAINER_INSTALL_PREFIX="/usr/local"
APPTAINER_CACHE_DIR="/var/cache/apptainer"
APPTAINER_SYSCONFDIR="/etc/apptainer"
APPTAINER_SYSCONFIG="/etc/sysconfig/apptainer"
APPTAINER_LIBEXECDIR="/usr/local/libexec/apptainer"
APPTAINER_LOCALSTATEDIR="/var/lib/apptainer"

# User and group
APPTAINER_USER="apptainer"
APPTAINER_GROUP="apptainer"

# Security settings
APPTAINER_ALLOW_SETUID=true
APPTAINER_ENABLE_FUSE=true
APPTAINER_ENABLE_SECCOMP=true
APPTAINER_ENABLE_CGROUPS=true
APPTAINER_ENABLE_NVIDIA=true
APPTAINER_ENABLE_ROCM=true

# Bind paths
APPTAINER_BIND_PATHS=("/scratch" "/work" "/home")
APPTAINER_BIND_DEV="yes"
APPTAINER_BIND_ETC_PASSWD="yes"
APPTAINER_BIND_ETC_GROUP="yes"
APPTAINER_BIND_ETC_HOSTS="yes"
APPTAINER_BIND_ETC_LOCALTIME="yes"
APPTAINER_BIND_ETC_SSL="yes"
APPTAINER_BIND_ETC_PKI="yes"
APPTAINER_BIND_ETC_OPENCL="yes"
APPTAINER_BIND_ETC_OPENMPI="yes"
APPTAINER_BIND_ETC_SLURM="yes"

# Cache settings
APPTAINER_DISABLE_CACHE=false
APPTAINER_CACHE_LIMIT="0"
APPTAINER_SHARED_LOOP_DEVICES="yes"
APPTAINER_LOOP_DEVICES="10"

# Logging settings
APPTAINER_LOG_LEVEL="info"
APPTAINER_LOG_FORMAT="standard"
APPTAINER_SYSLOG_LEVEL="info"

# Network settings
APPTAINER_NETWORK="bridge"
APPTAINER_NETWORK_ARGS=""

# Default container settings
APPTAINER_DEFAULT_HOME="/home"
APPTAINER_DEFAULT_SHELL="/bin/bash"
APPTAINER_DEFAULT_TMP="/tmp"
APPTAINER_DEFAULT_WORKDIR="/scratch"

# Module settings
APPTAINER_MODULE_ENABLED=true
APPTAINER_MODULE_DIR="/etc/modulefiles/container"

# Warewulf image settings
APPTAINER_CPU_IMAGE_ENABLED=true
APPTAINER_CPU_IMAGE_NAME="rockylinux-9.6"
