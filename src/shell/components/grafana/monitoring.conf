# Monitoring Configuration
ELASTICSEARCH_ENABLED=true
LOGSTASH_ENABLED=true
KIBANA_ENABLED=true
GRAFANA_ENABLED=true
FILEBEAT_ENABLED=true

# Elasticsearch Configuration
ELASTICSEARCH_CLUSTER_NAME="hpc-cluster"
ELASTICSEARCH_NODE_NAME="headnode"
ELASTICSEARCH_HOST="0.0.0.0"
ELASTICSEARCH_PORT=9200

# Logstash Configuration
LOGSTASH_BEATS_PORT=5044
LOGSTASH_CONF_DIR="/etc/logstash/conf.d"

# Kibana Configuration
KIBANA_PORT=5601
KIBANA_HOST="0.0.0.0"
KIBANA_ELASTICSEARCH_HOST="localhost:9200"

# Grafana Configuration
GRAFANA_PORT=3000
GRAFANA_DOMAIN="localhost"
GRAFANA_ADMIN_USER="admin"
GRAFANA_ADMIN_PASSWORD="admin"
GRAFANA_ANONYMOUS_ENABLED=true
GRAFANA_ANONYMOUS_ROLE="Viewer"

# Filebeat Configuration
FILEBEAT_LOG_PATHS=("/var/log/slurm/*.log")
FILEBEAT_LOG_TYPE="slurm"
FILEBEAT_LOGSTASH_HOST="localhost:5044" 