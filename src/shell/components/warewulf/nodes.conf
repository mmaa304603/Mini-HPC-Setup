#!/bin/bash

# Warewulf profile defaults
WAREWULF_IMAGE_NAME="rockylinux-9.6"
WAREWULF_SYSTEM_OVERLAYS="wwinit,wwclient,hostname,ssh.host_keys,systemd.netname,NetworkManager"
WAREWULF_RUNTIME_OVERLAYS="hosts,ssh.authorized_keys"

# Compute node definitions for Warewulf and SLURM integration
# Define node hostnames and their corresponding IP addresses.
# Ensure both arrays have the same length and matching indices.

# Example:
# COMPUTE_NODES=("cpu01" "cpu02" "cpu03")
# COMPUTE_NODE_IPS=("10.0.2.1" "10.0.2.2" "10.0.2.3")

COMPUTE_NODES=("cpu01" "cpu02" "cpu03")
COMPUTE_NODE_IPS=("10.0.2.1" "10.0.2.2" "10.0.2.3")
COMPUTE_NODE_HWADDRS=("00:e0:4c:06:07:3a" "00:e0:4c:06:07:6b" "00:e0:4c:06:07:94")

# Network device to block from DHCP
BLOCKED_MAC="88:a4:c2:c0:ac:e1"
