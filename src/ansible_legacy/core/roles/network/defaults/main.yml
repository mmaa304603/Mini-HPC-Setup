---
# This role validates network prerequisites only.
# Warewulf remains responsible for configuring the cluster network.

network_required_variables:
  - external_interface
  - external_ip
  - internal_interface
  - internal_ip
  - cluster_network
  - cluster_prefix

network_required_commands:
  - nmcli
  - firewall-cmd
  - ip

network_ipv4_pattern: >-
  ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}
  (?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$

# Require the management/external address to be available before installation.
network_validate_external_ip: true

# Do not require the internal IP to be assigned during preflight.
# Warewulf will configure it.
network_validate_internal_ip: false

# Confirm that the head node already has a usable default route.
network_validate_default_route: true

# Ensure the two interfaces are physically distinct.
network_require_distinct_interfaces: true