---
# Backup role tasks

- name: Create backup directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - /backup/config
    - /backup/data
    - /backup/system
    - /backup/database

- name: Backup configuration files
  archive:
    path: /etc
    dest: /backup/config/config-{{ ansible_date_time.date }}.tar.gz
    format: gz

- name: Backup Warewulf configuration
  archive:
    path: /etc/warewulf
    dest: /backup/config/warewulf-{{ ansible_date_time.date }}.tar.gz
    format: gz

- name: Backup SLURM configuration
  archive:
    path: /etc/slurm
    dest: /backup/config/slurm-{{ ansible_date_time.date }}.tar.gz
    format: gz

- name: Backup Globus configuration
  archive:
    path: /etc/globus-connect-server
    dest: /backup/config/globus-{{ ansible_date_time.date }}.tar.gz
    format: gz

- name: Backup Spack configuration
  archive:
    path: /etc/spack
    dest: /backup/config/spack-{{ ansible_date_time.date }}.tar.gz
    format: gz

- name: Backup monitoring configuration
  archive:
    path: "{{ item.path }}"
    dest: "/backup/config/{{ item.name }}-{{ ansible_date_time.date }}.tar.gz"
    format: gz
  with_items:
    - { path: /etc/elasticsearch, name: elasticsearch }
    - { path: /etc/kibana, name: kibana }
    - { path: /etc/grafana, name: grafana }

- name: Backup user data
  synchronize:
    src: /home
    dest: /backup/data/home-{{ ansible_date_time.date }}
    archive: yes
    delete: yes

- name: Backup shared data
  synchronize:
    src: /shared
    dest: /backup/data/shared-{{ ansible_date_time.date }}
    archive: yes
    delete: yes

- name: Backup scratch data
  synchronize:
    src: /scratch
    dest: /backup/data/scratch-{{ ansible_date_time.date }}
    archive: yes
    delete: yes

- name: Stop services for system backup
  systemd:
    name: "{{ item }}"
    state: stopped
  with_items:
    - warewulfd
    - slurmctld
    - globus-connect-server

- name: Backup system state
  archive:
    path: "{{ item.path }}"
    dest: "/backup/system/{{ item.name }}-{{ ansible_date_time.date }}.tar.gz"
    format: gz
  with_items:
    - { path: /var/lib/warewulf, name: warewulf }
    - { path: /var/lib/slurm, name: slurm }
    - { path: /var/lib/globus-connect-server, name: globus }

- name: Start services after system backup
  systemd:
    name: "{{ item }}"
    state: started
  with_items:
    - warewulfd
    - slurmctld
    - globus-connect-server

- name: Backup Elasticsearch
  shell: elasticsearch-backup /backup/database/elasticsearch-{{ ansible_date_time.date }}

- name: Backup Grafana
  shell: grafana-backup /backup/database/grafana-{{ ansible_date_time.date }}

- name: Set backup permissions
  file:
    path: "{{ item }}"
    mode: '0600'
    owner: root
    group: root
  with_items:
    - /backup/config/*
    - /backup/data/*
    - /backup/system/*
    - /backup/database/*

- name: Clean old backups
  find:
    paths:
      - /backup/config
      - /backup/data
      - /backup/system
      - /backup/database
    age: "30d"
    state: absent 